<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080b14">
  <title>Snack-Shack Inventory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <main class="shell">
    <dialog id="loginDialog" class="login-dialog panel">
      <form id="authForm" method="dialog">
        <div class="dialog-head">
          <div><p class="eyebrow">ADMIN ACCESS</p><h2>Sign in to edit</h2></div>
          <button id="closeLogin" class="icon-btn" type="button" aria-label="Close">✕</button>
        </div>
        <p class="muted">Visitors can view quantities. Only the administrator can make changes.</p>
        <label>Username<input id="username" autocomplete="username" required value="korbit"></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Password"></label>
        <p id="authError" class="error" role="alert"></p>
        <button id="loginBtn" class="primary" type="submit">Sign in as admin</button>
      </form>
    </dialog>

    <section id="appView" class="app">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">S</span><span>Snack-Shack</span></div>
        <div class="userbox">
          <span id="modeBadge" class="mode-badge">View only</span>
          <button id="loginOpenBtn" class="secondary small">Admin login</button>
          <button id="logoutBtn" class="secondary small hidden">Sign out</button>
        </div>
      </header>

      <section class="hero panel">
        <h1>Live Snack Inventory</h1>
      </section>

      <section class="payment-strip panel" aria-label="Payment methods">
        <div class="payment-copy"><span class="payment-label">PAYMENT</span></div>
        <div class="payment-methods">
          <span class="payment-chip twint"><span class="payment-icon">T</span>TWINT</span>
          <span class="payment-or">or</span>
          <span class="payment-chip cash"><span class="payment-icon">Fr.</span>CHF</span>
        </div>
      </section>

      <section class="panel inventory">
        <div class="toolbar">
          <form id="addForm" class="add-form admin-only hidden">
            <input id="itemInput" maxlength="80" required placeholder="Product name" aria-label="Product name">
            <input id="priceInput" type="number" min="0" step="0.05" inputmode="decimal" required placeholder="Price (CHF)" aria-label="Price in Swiss francs">
            <input id="sizeInput" maxlength="30" placeholder="Size (e.g. 500 ML)" aria-label="Product size">
            <button class="primary" type="submit">+ Add</button>
          </form>
          <div class="tools">
            <input id="searchInput" type="search" placeholder="Search…" aria-label="Search items">
            <button id="sortBtn" class="secondary" type="button">A–Z</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Item</th><th class="right">Quantity</th><th class="admin-column hidden"><span class="sr-only">Actions</span></th></tr></thead>
            <tbody id="itemRows"></tbody>
          </table>
          <div id="emptyState" class="empty"><div class="empty-icon">＋</div><strong>No items yet</strong><span>Add your first item above.</span></div>
        </div>
        <div class="statusbar"><span id="syncStatus">Connecting…</span><span id="itemCount">0 items</span></div>
      </section>
      <footer class="site-footer">Design: O. Deubelbeiss 12.11.2026</footer>
    </section>
  </main>

  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch to light mode">
    <span id="themeIcon" aria-hidden="true">☀</span>
  </button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
